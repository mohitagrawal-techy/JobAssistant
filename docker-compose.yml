services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: jobassistent
      POSTGRES_PASSWORD: jobassistent
      POSTGRES_DB: jobassistent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobassistent"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+asyncpg://jobassistent:jobassistent@db:5432/jobassistent
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-at-least-32-bytes}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-gpt-oss:20b}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      STORAGE_DIR: /data/storage
      ASSISTANT_INTERVAL_SECONDS: ${ASSISTANT_INTERVAL_SECONDS:-1800}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - resume_storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
  resume_storage:
